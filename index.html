<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Chronicle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="password-prompt-container">
        <h2>Eternal Chronicle</h2>
        <p id="password-message">Enter your passphrase to unlock your journal.</p>
        <input type="password" id="password-input" placeholder="Your secret passphrase">
        <button id="password-submit-button">Unlock / Initialize</button>
        <p id="password-error-message" class="error-message"></p>
    </div>

    <div id="app-view" class="hidden">
        <div id="calendar-panel">
            <!-- Calendar will be rendered here by JavaScript -->
        </div>
        <div id="entry-list-panel">
            <!-- Entry list will be rendered here -->
            <ul id="entry-list"></ul>
        </div>
        <div id="writing-area-panel">
            <header id="app-header">
                <h1>Eternal Chronicle</h1>
                <div id="controls">
                    <input type="search" id="search-input" placeholder="Search entries...">
                    <button id="sign-out-button" title="Sign Out">🚪</button>
                </div>
            </header>
            <div id="entry-editor-panel">
                <input type="text" id="entry-title-input" placeholder="Entry Title (Optional)">
                <textarea id="entry-content-textarea" placeholder="Start writing your thoughts..."></textarea>
                    <div id="editor-actions">
                        <span id="autosave-status"></span>
                        {/* Delete button removed from here */}
                    </div>
                </div>
        </div>
    </div>

    <script src="js/crypto.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
